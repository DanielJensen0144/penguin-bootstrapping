[project]
name = "bootstrapping"
version = "0.1.0"
description = "Statistical bootstrapping in python"
readme = "README.md"
authors = [
    { name = "Daniel Jensen", email = "jensendaniel0144@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "jupyter>=1.1.1",
    "jupyterlab-vim>=4.1.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

[project.scripts]
bootstrapping = "bootstrapping:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
